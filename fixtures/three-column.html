<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>litedesign fixture — three columns</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        padding: 24px;
        background: #ffffff;
        color: #111111;
        font: 16px/1.5 system-ui, sans-serif;
      }

      .row {
        display: flex;
        gap: 8px;
      }

      .row > div {
        flex: 1;
        padding: 16px;
        border-radius: 8px;
        background: #f3f4f6;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div>Alpha</div>
      <div>Beta</div>
      <div>Gamma</div>
    </div>
  </body>
</html>
